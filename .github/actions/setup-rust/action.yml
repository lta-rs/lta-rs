name: "Setup Rust Environment"
description: "Sets up Rust toolchain with sccache and dependency caching"

inputs:
  toolchain:
    description: "Rust toolchain version"
    required: false
    default: "stable"
  components:
    description: "Rust components to install (comma-separated)"
    required: false
    default: "clippy,rustfmt"
  cache-key:
    description: "Additional cache key"
    required: false
    default: ""
  cache-directories:
    description: "Additional non-workspace directories to cache (newline-separated)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Setup sccache
      uses: mozilla/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Cache Cargo dependencies
      uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        key: ${{ inputs.cache-key }}
        cache-directories: ${{ inputs.cache-directories }}