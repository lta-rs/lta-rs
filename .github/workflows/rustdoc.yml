name: Publish lta-next rustdoc

on:
  push:
    branches:
      - lta-next
  workflow_dispatch:

permissions: {}

concurrency:
  group: lta-next-rustdoc
  cancel-in-progress: true

jobs:
  build:
    # A manual dispatch must also select the lta-next ref.
    if: github.ref == 'refs/heads/lta-next'
    name: Build rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.95.0"

      - name: Build documentation
        run: cargo doc --offline --all-features --no-deps

      - name: Add site entry point
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=lta/index.html">' \
            '<link rel="canonical" href="lta/index.html">' \
            '<title>lta documentation</title>' \
            > target/doc/index.html

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdoc-site
          path: target/doc
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy rustdoc
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: lta-next-rustdoc
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Download documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdoc-site
          path: site

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          token: ""
          package-manager-cache: false

      - name: Create isolated Wrangler directory
        run: mkdir .wrangler

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .wrangler
          packageManager: npm
          wranglerVersion: "4.123.0"
          command: >-
            pages deploy ../site
            --project-name=lta-rs-docs
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
