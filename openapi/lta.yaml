      properties:
        odata.metadata:
          type: string
          format: uri
          description: OData metadata URL.
          x-satay:
            ignore: true

        value:
          type: array
          description: Bicycle parking locations within the queried radius.
          items:
            $ref: "#/components/schemas/BicycleParking"

    BicycleParking:
      type: object
      additionalProperties: false
      required:
        - Description
        - Latitude
        - Longitude
        - RackType
        - RackCount
        - ShelterIndicator
      properties:
        Description:
          type: string
          description: Description of the bicycle parking location.
          x-satay:
            identifier: desc

        Latitude:
          $ref: "#/components/schemas/Latitude"
          x-satay:
            identifier: lat

        Longitude:
          $ref: "#/components/schemas/Longitude"
          x-satay:
            identifier: long

        RackType:
          $ref: "#/components/schemas/RackType"

        RackCount:
          type: integer
          description: Number of racks at the location.
          x-satay:
            integer-type: u16

        ShelterIndicator:
          type: string
          description: Whether the location is sheltered from the weather.
          x-satay:
            identifier: shelter-indicator
            parse-as: bool
            true-values: ["Y"]
            false-values: ["N", ""]
            unknown-as: false

    RackType:
      description: Type of bicycle parking racks.
      anyOf:
        - type: string
        - type: string
          description: Known rack type spellings.
          enum:
            - Yellow Box
            - Yellow Box_Private
            - Racks_MRT
            - Racks_Bus Stop
            - Racks_URA
            - Racks_AVA
            - Racks_ITE
            - Racks_JTC
            - Racks_PA
            - Racks_NParks
            - Racks_HDB
            - Racks_NLB
            - Racks_NEA
          x-satay:
            enum-variants:
              "Yellow Box": YellowBox
              "Yellow Box_Private": YellowBoxPrivate
              "Racks_MRT": RacksMRT
              "Racks_Bus Stop": RacksBusStop
              "Racks_URA": RacksURA
              "Racks_AVA": RacksAVA
              "Racks_ITE": RacksITE
              "Racks_JTC": RacksJTC
              "Racks_PA": RacksPA
              "Racks_NParks": RacksNParks
              "Racks_HDB": RacksHDB
              "Racks_NLB": RacksNLB
              "Racks_NEA": RacksNEA

    FloodAlertsResponse:
      type: object
      additionalProperties: false
      required:
        - odata.metadata
        - value
      properties:
        odata.metadata:
          type: string
          format: uri
          description: OData metadata URL.
          x-satay:
            ignore: true

        value:
          type: array
          description: Flood alerts in this response.
          items:
            $ref: "#/components/schemas/FloodAlert"

    FloodAlert:
      type: object
      additionalProperties: false
      required:
        - alertId
        - dateTime
        - msgType
        - event
        - responseType
        - urgency
        - severity
        - expires
        - senderName
        - headline
        - description
        - instruction
        - areaDesc
        - circle
        - status
      properties:
        alertId:
          type: string
          description: A number or string uniquely identifying this observation, assigned by the sender.
          example: "2.49.0.0.702.2-BCM-17612003774680-PUBCON-DYOONG"
        dateTime:
          type: string
          description: Date and Time the flood observation was issued by PUB.
          example: "2025-05-22T09:55:00+08:00"
          x-satay:
            parse-as: offset-datetime
        msgType:
          $ref: "#/components/schemas/FloodMsgType"
          x-satay:
            identifier: msg-type
        event:
          $ref: "#/components/schemas/FloodEvent"
        responseType:
          $ref: "#/components/schemas/FloodResponseType"
          x-satay:
            identifier: response-type
        urgency:
          $ref: "#/components/schemas/FloodUrgency"
        severity:
          $ref: "#/components/schemas/FloodSeverity"
        expires:
          type: string
          description: Expiry time of the flood alert. A flood alert automatically expires after 24 hours by default.
          example: "2025-10-24T14:19:37+08:00"
          x-satay:
            parse-as: offset-datetime
        senderName:
          $ref: "#/components/schemas/FloodSenderName"
          x-satay:
            identifier: sender-name
        headline:
          type: string
          description: Text headline of the alert message.
          example: "Flash Flood Alert"
        description:
          type: string
          description: Location of Flood. Text describing the subject event of the alert message.
          example: "Flash flood at Bt Timah Rd from Wilby Rd to Blackmore Dr. Please avoid the area. Issued 1705 hrs."
          x-satay:
            identifier: desc
        instruction:
          type: string
          description: Text describing the recommended action to be taken by recipients of the alert message.
          example: "Please avoid this area for the next one (1) hour."
        areaDesc:
          type: string
          description: Area description.
          example: "Jalan Mastuli, Singapore"
        circle:
          type: string
          description: lat/long and radius in kilometers. The radius refers to the broadcasting radius of the specific alert, it is NOT indicative of the extent of the flooding.
          example: "1.35479,103.88611 0.05"
        status:
          $ref: "#/components/schemas/FloodStatus"

    FloodMsgType:
      description: Code denoting the nature of the alert message.
      type: string
      enum:
        - Alert
        - Cancel

    FloodEvent:
      description: Text denoting the type of the subject event of the alert message. Event will always be 'Flood'.
      type: string
      enum:
        - Flood

    # since we dk the actual possible values we are using anyOf first
    FloodResponseType:
      description: Alert response type. Code denoting the type of action recommended for the target audience.
      anyOf:
        - type: string
        - type: string
          enum:
            - Avoid
          x-satay:
            enum-variants:
              Avoid: Avoid

    # since we dk the actual possible values we are using anyOf first
    FloodUrgency:
      description: Code denoting the urgency of the subject event of the alert message.
      anyOf:
        - type: string
        - type: string
          enum:
            - Immediate
            - Expected
            - Future
            - Past
            - Unknown
          x-satay:
            enum-variants:
              Immediate: Immediate
              Expected: Expected
              Future: Future
              Past: Past
              Unknown: Unknown

    FloodSeverity:
      description: Code denoting the severity of the subject event of the alert message.
      type: string
      enum:
        - Extreme
        - Severe
        - Moderate
        - Minor

    FloodSenderName:
      description: Text naming the originator of the alert message. senderName will always be 'PUB'.
      type: string
      enum:
        - PUB
      x-satay:
        enum-variants:
          PUB: Pub

    FloodStatus:
      description: Code denoting the appropriate handling of the alert message.
      type: string
      enum:
        - Actual
        - Exercise
        - System
        - Test
        - Draft

    EvChargingPointsBatchResponse:
      type: object
      additionalProperties: false
      required:
        - odata.metadata
        - value
      properties:
        odata.metadata:
          type: string
          format: uri
          description: OData metadata URL.
          x-satay:
            ignore: true

        value:
          type: array
          description: EV charging points batch data files in this response.
          items:
            $ref: "#/components/schemas/EvChargingPointsBatchLink"

    EvChargingPointsBatchLink:
      type: object
      additionalProperties: false
      required:
        - Link
      properties:
        Link:
          type: string
          format: uri
          description: URL of the EV charging points batch data file. Each pre-signed link expires after 15 minutes.

    PostalCode:
      type: string
      description: >
        6-digit Singapore postal code. The DataMall API rejects any other
        shape with 400 "Invalid parameter for postal code".
      pattern: "^[0-9]{6}$"
      example: "650346"

    EvLocationId:
      type: string
      description: >
        Location identifier made up from the first 6 decimal places of
        longitude followed by the 6-digit postal code.
      pattern: "^[0-9]{12}$"
      example: "750010650346"

    EvConnectorId:
      type: string
      description: >
        Connector ID assigned by LTA during charger registration. The EV
        charger registration code makes up the first 8 characters.
      pattern: "^[A-Z][0-9]+[A-Z]-[0-9]{3}$"
      example: "R109701B-001"

    EvChargingPointsResponse:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          $ref: "#/components/schemas/EvChargingPointsValue"

    EvChargingPointsValue:
      type: object
      additionalProperties: false
      required:
        - evLocationsData
      properties:
        evLocationsData:
          type: array
          description: EV charging locations for the queried postal code. Empty when no chargers exist for the postal code.
          items:
            $ref: "#/components/schemas/EvLocation"

    EvLocation:
      type: object
      additionalProperties: false
      required:
        - address
        - name
        - longitude
        - latitude
        - locationId
        - status
        - chargingPoints
      properties:
        address:
          type: string
          description: Address of the charging station.

        name:
          type: string
          description: Name of the charging station.

        longitude:
          $ref: "#/components/schemas/Longitude"
          x-satay:
            identifier: long

        latitude:
          $ref: "#/components/schemas/Latitude"
          x-satay:
            identifier: lat

        locationId:
          $ref: "#/components/schemas/EvLocationId"

        status:
          type: string
          description: Status of the charging station. Always empty in observed live responses.

        chargingPoints:
          type: array
          description: Charging points at this location.
          items:
            $ref: "#/components/schemas/EvChargingPoint"

    EvChargingPoint:
      type: object
      additionalProperties: false
      required:
        - status
        - operatingHours
        - operator
        - position
        - name
        - id
        - plugTypes
      properties:
        status:
          $ref: "#/components/schemas/EvChargingPointStatus"

        operatingHours:
          type: string
          description: Operation hours of the charger. Always empty in observed live responses.

        operator:
          type: string
          description: Charging operator of the charger.

        position:
          type: string
          description: Position of the charger.

        name:
          type: string
          description: Name of the charger.

        id:
          type: string
          description: ID of the charger. Always empty in observed live responses.

        plugTypes:
          type: array
          description: Plug types available on this charger.
          items:
            $ref: "#/components/schemas/EvPlugType"

    EvChargingPointStatus:
      description: >
        Current status of the charger. "0" occupied, "1" available,
        "100" not available.
      type: string
      enum:
        - "0"
        - "1"
        - "100"
      x-satay:
        enum-variants:
          "0": Occupied
          "1": Available
          "100": NotAvailable

    EvPlugType:
      type: object
      additionalProperties: false
      required:
        - plugType
        - powerRating
        - chargingSpeed
        - price
        - priceType
        - evIds
      properties:
        plugType:
          $ref: "#/components/schemas/EvPlugTypeKind"

        powerRating:
          $ref: "#/components/schemas/EvPowerRating"

        chargingSpeed:
          type: string
          description: Charging speed in kW as a numeric string.
          example: "7.4"
          x-satay:
            parse-as: f64

        price:
          type: string
          description: Charging price including VAT as a numeric string. Empty when the price is unavailable.
          example: "0.6490"
          x-satay:
            parse-as: f64
            none-if: [""]

        priceType:
          $ref: "#/components/schemas/EvPriceType"

        evIds:
          type: array
          description: Connectors for this plug type.
          items:
            $ref: "#/components/schemas/EvConnector"

    EvPlugTypeKind:
      description: Type of charging plug.
      anyOf:
        - type: string
        - type: string
          description: Known plug type spellings.
          enum:
            - Type 2
            - Combo 2
            - CHAdeMO
          x-satay:
            enum-variants:
              "Type 2": Type2
              "Combo 2": Combo2
              "CHAdeMO": Chademo

    EvPowerRating:
      description: Power rating of the charging point.
      anyOf:
        - type: string
        - type: string
          description: Known power rating spellings.
          enum:
            - AC
            - DC
          x-satay:
            enum-variants:
              AC: Ac
              DC: Dc

    EvPriceType:
      description: >
        Price type of the charging price. The guide documents "$/h" and
        "$/kWh"; live responses use "kWh", "free", and empty for unavailable.
      anyOf:
        - type: string
        - type: string
          description: Known price type spellings.
          enum:
            - kWh
            - free
            - ""
          x-satay:
            enum-variants:
              kWh: Kwh
              free: Free
              "": Unspecified

    EvConnector:
      type: object
      additionalProperties: false
      required:
        - id
        - evCpId
        - status
      properties:
        id:
          type: string
          description: Refer to evCpId. Always empty in observed live responses.

        evCpId:
          $ref: "#/components/schemas/EvConnectorId"

        status:
          $ref: "#/components/schemas/EvConnectorStatus"

    EvConnectorStatus:
      description: >
        Current status of the connector. "0" occupied, "1" available,
        empty string when unavailable or unknown.
      type: string
      enum:
        - "0"
        - "1"
        - ""
      x-satay:
        enum-variants:
          "0": Occupied
          "1": Available
          "": Unspecified

